name: Daily TA Briefing

on:
  # Git-based manual trigger: pushing a change to .trigger-send runs a real
  # scan+send. Lets the briefing be fired with only git access (no Actions
  # UI or API needed). Ordinary code pushes do NOT trigger runs.
  push:
    paths:
      - ".trigger-send"
  schedule:
    # Never schedule on the hour. GitHub warns that "high load times include
    # the start of every hour" and to "schedule your workflow to run at a
    # different time of the hour" — at :00 these runs were queuing 2-4 hours,
    # which is what pushed the morning recap out of its window for days.
    #
    # Times are UTC, so each ET slot needs an EDT and an EST entry plus a
    # retry; the first one to fire sends and .last-send makes the rest no-ops.
    # Each is set ~7 minutes before the target because the run itself takes
    # about that long, so the mail lands on the hour rather than after it.
    #
    # Morning recap — mail at ~9:00am EDT (~8:00am EST) + retries
    - cron: "53 12 * * 1-5"
    - cron: "53 13 * * 1-5"
    - cron: "53 14 * * 1-5"
    # Afternoon recap — mail at ~5:30pm EDT (~4:30pm EST), after the close
    - cron: "23 21 * * 1-5"
    - cron: "23 22 * * 1-5"
    - cron: "23 23 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which briefing to send"
        type: choice
        options:
          - scan
          - watchlist
        default: scan
      dry_run:
        description: "Dry run (render charts but send no email)"
        type: boolean
        default: false
      scorecard_only:
        description: "Print the performance scorecard to the log and stop"
        type: boolean
        default: false
      analysis:
        description: "Deep analysis (Fable): ledger post-mortem or methodology audit"
        type: choice
        options:
          - none
          - postmortem
          - audit
        default: none

permissions:
  contents: write  # the send marker is committed back to the branch

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — decide slot and dedupe against today's sends
        id: guard
        run: |
          echo "Secret GOOG configured: ${{ secrets.GOOG != '' }}"
          echo "Secret TARECAP2 configured: ${{ secrets.TARECAP2 != '' }}"
          hour=$(TZ=America/New_York date +%H)
          today=$(TZ=America/New_York date +%F)
          event="${{ github.event_name }}"
          go=false
          mode=scan
          if [ "$hour" -lt 13 ]; then slot=morning; else slot=afternoon; fi
          if [ "$event" = "workflow_dispatch" ]; then
            go=true
            mode="${{ inputs.mode }}"
          elif [ "$event" = "push" ]; then
            go=true
          else
            # Scheduled run: take the slot from WHICH cron fired, not from the
            # hour it actually ran. GitHub routinely delays scheduled runs by
            # hours — observed ~4h — which previously pushed the morning crons
            # past the morning window and silently killed the 9am recap for
            # days. The cron expression states the intent and cannot drift;
            # the .last-send marker still guarantees one send per slot per day.
            case "${{ github.event.schedule }}" in
              "53 12 "*|"53 13 "*|"53 14 "*) slot=morning ;;
              "23 21 "*|"23 22 "*|"23 23 "*) slot=afternoon ;;
              *) slot="" ;;
            esac
            echo "Cron '${{ github.event.schedule }}' -> $slot slot (now ${hour}:xx ET)"
            if [ -z "$slot" ]; then
              echo "Skipping: unrecognised cron schedule."
            elif grep -qx "$today $slot" .last-send 2>/dev/null; then
              echo "Skipping: $slot recap already sent today."
            else
              go=true
            fi
          fi
          {
            echo "go=$go"
            echo "mode=$mode"
            echo "slot=$slot"
            echo "today=$today"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Run briefing
        if: steps.guard.outputs.go == 'true'
        env:
          # Repo secrets carry user-chosen names; the step below routes them
          # by value format (Anthropic keys start with sk-ant-).
          SECRET_A: ${{ secrets.GOOG }}
          SECRET_B: ${{ secrets.TARECAP2 }}
          # Preferred, unambiguous slot for the Anthropic key. Set this and a
          # new key can be added without knowing which legacy secret above
          # holds the key and which holds the Gmail app password.
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: X/Twitter chatter for picks and podcast setups
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # Optional: turns % -of-account sizing into share counts and dollars
          TA_ACCOUNT_SIZE: ${{ secrets.TA_ACCOUNT_SIZE }}
        run: |
          if [[ "$SECRET_A" == sk-ant-* ]]; then
            export ANTHROPIC_API_KEY="$SECRET_A" TA_SMTP_PASSWORD="$SECRET_B"
          else
            export ANTHROPIC_API_KEY="$SECRET_B" TA_SMTP_PASSWORD="$SECRET_A"
          fi
          # A dedicated ANTHROPIC_API_KEY secret always wins, leaving the
          # Gmail app password in the legacy pair untouched.
          if [ -n "$ANTHROPIC_KEY" ]; then
            export ANTHROPIC_API_KEY="$ANTHROPIC_KEY"
            echo "Using the ANTHROPIC_API_KEY secret."
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::No Anthropic key found — commentary will fall back."
          fi
          if [ "${{ steps.guard.outputs.slot }}" = "morning" ]; then
            label="Claude TA Morning Recap"
          else
            label="Claude TA Afternoon Recap"
          fi
          if [ "${{ inputs.analysis }}" = "postmortem" ]; then
            python ta_briefing_v2.py --postmortem
            exit 0
          fi
          if [ "${{ inputs.analysis }}" = "audit" ]; then
            python ta_briefing_v2.py --audit
            exit 0
          fi
          if [ "${{ inputs.scorecard_only }}" = "true" ]; then
            python ta_briefing_v2.py --scorecard
            exit 0
          fi
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="--dry-run"
          fi
          if [ "${{ steps.guard.outputs.mode }}" = "scan" ]; then
            python ta_briefing_v2.py --scan --heading "$label" $args
          else
            python ta_briefing_v2.py --heading "$label" $args
          fi

      - name: Record send marker
        # Only a run that actually emailed may claim the slot. Report-only
        # runs (scorecard, post-mortem, audit) exit before sending, and
        # marking the slot would suppress that day's real recap.
        if: >-
          steps.guard.outputs.go == 'true'
          && inputs.dry_run != true
          && inputs.scorecard_only != true
          && inputs.analysis != 'postmortem'
          && inputs.analysis != 'audit'
        run: |
          echo "${{ steps.guard.outputs.today }} ${{ steps.guard.outputs.slot }}" >> .last-send
          tail -n 14 .last-send > .last-send.tmp && mv .last-send.tmp .last-send
          git config user.name "TA Chart Agent"
          git config user.email "actions@github.com"
          # Stage each file on its own: `git add a b c` aborts and stages
          # NOTHING if any path is missing, and the extraction cache does not
          # exist on runs where the API was unavailable — which would have
          # silently dropped the day's ledger rows.
          for f in .last-send picks_ledger.csv .extract_cache.json; do
            [ -e "$f" ] && git add "$f"
          done
          git commit -m "Record ${{ steps.guard.outputs.slot }} send ${{ steps.guard.outputs.today }} [skip ci]" || exit 0
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}" || echo "::warning::marker push failed (next scheduled run may resend)"

      - name: Upload charts as artifact
        if: steps.guard.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ta-briefing-charts
          # PNGs and analysis reports only: the preview HTML can contain
          # portfolio data, and artifacts on a public repo are downloadable
          # by anyone. Reports cover the scan's own record, not holdings.
          path: |
            output/*.png
            output/postmortem.md
            output/audit.md
          retention-days: 14
