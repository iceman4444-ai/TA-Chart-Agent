name: Daily TA Briefing

on:
  schedule:
    # GitHub Actions cron is UTC only, so each ET time gets two entries (EDT
    # and EST) and the guard step below keeps only the run that lands on the
    # right hour in America/New_York. Weekdays only (1-5).
    #
    # 9:00am ET — watchlist briefing
    - cron: "0 13 * * 1-5"
    - cron: "0 14 * * 1-5"
    # 5:00pm ET — bullish scan (top 5 from the scan universe)
    - cron: "0 21 * * 1-5"
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which briefing to send"
        type: choice
        options:
          - watchlist
          - scan
        default: watchlist
      dry_run:
        description: "Dry run (render charts but send no email)"
        type: boolean
        default: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — pick mode from the New York hour
        id: guard
        run: |
          echo "Secret TA_SMTP_PASSWORD configured: ${{ secrets.TA_SMTP_PASSWORD != '' }}"
          echo "Secret ANTHROPIC_API_KEY configured: ${{ secrets.ANTHROPIC_API_KEY != '' }}"
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$hour" = "09" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "mode=watchlist" >> "$GITHUB_OUTPUT"
          elif [ "$hour" = "17" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "mode=scan" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: it is ${hour}:xx ET (DST shoulder run)."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Run briefing
        if: steps.guard.outputs.go == 'true'
        env:
          TA_SMTP_PASSWORD: ${{ secrets.TA_SMTP_PASSWORD }}
          # Optional: enables Claude-written driver commentary in the scan email
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="--dry-run"
          fi
          if [ "${{ steps.guard.outputs.mode }}" = "scan" ]; then
            python ta_briefing_v2.py --scan $args
          else
            python ta_briefing_v2.py $args
          fi

      - name: Upload charts as artifact
        if: steps.guard.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ta-briefing-charts
          path: output/
          retention-days: 14
