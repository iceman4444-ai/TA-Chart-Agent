# TA Chart Agent v2 configuration
#
# Everything in this file is safe to commit EXCEPT a password — the SMTP
# password is never stored here. It is read from the TA_SMTP_PASSWORD
# environment variable (or a GitHub Actions secret when run on a schedule).

# Tickers to analyze. Any Yahoo Finance symbol works (stocks, ETFs, ^GSPC, BTC-USD, ...).
tickers:
  - SPY
  - QQQ
  - AAPL
  - MSFT
  - NVDA

# How much daily history to fetch (calendar days). Needs to be comfortably
# larger than the slowest indicator window (SMA 200) so the charts have no
# warm-up gaps.
lookback_days: 500

# How many trading days to show on the charts.
chart_days: 180

indicators:
  sma_fast: 20
  sma_slow: 50
  sma_long: 200
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  fibonacci: true   # draw Fibonacci retracement levels on the price panel
  trendlines: true  # auto-detect support/resistance trendlines from swing pivots

# Where charts and the email preview are written.
output_dir: output

# Research inbox: recent newsletters pulled from the Gmail account (same app
# password used for sending, via IMAP) and given to Claude as additional
# context when writing the scan commentary.
research:
  enabled: true
  imap_host: imap.gmail.com
  gmail_search: "TMT Breakout newer_than:10d"
  max_items: 3     # newest matching messages to include
  max_chars: 4000  # excerpt length per message
  # Investment podcast highlights: the user's podcast-summarizing Claude
  # project emails its output to this inbox; the newest matching message is
  # distilled into a bulleted section at the bottom of the recap.
  podcast_search: "subject:podcast newer_than:7d"
  podcast_max_items: 2
  podcast_max_chars: 6000
  # How many podcast-mentioned tickers get a full trade setup (TA scoring,
  # support/resistance levels, chart) in the Podcast Trade Setups section.
  podcast_max_setups: 3
  # Podcast RSS network: recent episodes (titles + show notes) from these
  # feeds join the inbox messages as podcast intel. All URLs verified live.
  podcast_feeds:
    - https://omny.fm/shows/odd-lots/playlists/podcast.rss   # Bloomberg Odd Lots
    - https://feeds.megaphone.fm/CLS2859450455               # Invest Like the Best
    - https://allinchamathjason.libsyn.com/rss               # All-In
    - https://animalspiritspod.libsyn.com/rss                # Animal Spirits
    - https://theinvestorspodcast.libsyn.com/rss             # We Study Billionaires
    - https://mebfaber.libsyn.com/rss                        # The Meb Faber Show
    - https://feeds.feedburner.com/MacroVoices               # MacroVoices
    - https://feeds.megaphone.fm/forwardguidance             # Forward Guidance
    - https://chatwithtraders.libsyn.com/rss                 # Chat With Traders
    - https://omny.fm/shows/masters-in-business/playlists/podcast.rss  # Masters in Business
    - https://feeds.megaphone.fm/profgmarkets                # Prof G Markets
    - https://omny.fm/shows/bloomberg-surveillance/playlists/podcast.rss  # Bloomberg Surveillance
    - https://feeds.megaphone.fm/DSLLC6297708582             # Founders (David Senra)
    - https://markethuddle.com/feed/podcast/                 # The Market Huddle
  podcast_feed_days: 7   # episode recency window
  podcast_feed_max: 10   # newest episodes kept across all feeds
  podcast_feed_chars: 2000
  # Guest cross-pollination: guests appearing in the network's recent
  # episodes are looked up on the iTunes episode search, and their fresh
  # interviews on OTHER shows join the intel too.
  guest_crossover: true
  guest_max: 5        # guests followed per run
  crossover_days: 21  # recency window for cross-show interviews
  crossover_max: 5    # crossover episode notes kept
  # X/Twitter chatter (official API v2; requires an X_BEARER_TOKEN secret —
  # paid X API tier with search access). Skipped silently when absent.
  twitter_enabled: true
  twitter_max_tickers: 6

# Portfolio: open positions reconstructed from Fidelity trade-confirmation
# emails (fetched via IMAP, parsed by Claude in-memory at run time; symbols
# and quantities are never logged, stored, or committed).
portfolio:
  enabled: true
  gmail_search: 'from:fidelity (confirmation OR executed OR "order has been filled") newer_than:90d'
  max_emails: 20

# Bullish scan (--scan): score the universe and email the top_n most bullish
# charts. Run on the 5:00pm ET weekday schedule.
#
# The universe is resolved at runtime from the published holdings of these
# ETFs (top ~10 per fund via Yahoo Finance, de-duplicated, US listings only).
scan:
  top_n: 5
  etf_holdings:
    - CHAT   # Roundhill Generative AI & Technology
    - CNEQ   # Alger Concentrated Equity
    - GRNY   # Fundstrat Granny Shots US Large Cap
  # Broad indexes scanned in full (membership via Wikipedia, since Yahoo
  # only exposes a fund's top ~10 holdings).
  index_universes:
    - SPY    # S&P 500
    - QQQ    # Nasdaq-100
  # Optional manual additions to the resolved holdings.
  extra_tickers: []
  # Fallback universe, used only if no ETF holdings can be fetched.
