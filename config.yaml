email:
  enabled: true
  smtp_host: smtp.gmail.com
  smtp_port: 587          # 587 = STARTTLS (use 465 with use_ssl: true for implicit SSL)
  use_ssl: false
  username: onulakjd@gmail.com
  from_addr: onulakjd@gmail.com
  to_addrs:
    - onulakjd@gmail.com
  # Subjects are "Claude TA Morning Recap — <date>" (9am watchlist) and
  # "Claude TA Afternoon Recap — <date>" (5pm bullish scan).
  # Password comes from the TA_SMTP_PASSWORD environment variable.
  # For Gmail this must be an App Password, not your account password.
