# TA Chart Agent v2 configuration
#
# Everything in this file is safe to commit EXCEPT a password — the SMTP
# password is never stored here. It is read from the TA_SMTP_PASSWORD
# environment variable (or a GitHub Actions secret when run on a schedule).

# Tickers to analyze. Any Yahoo Finance symbol works (stocks, ETFs, ^GSPC, BTC-USD, ...).
tickers:
  - SPY
  - QQQ
  - AAPL
  - MSFT
  - NVDA

# How much daily history to fetch (calendar days). Needs to be comfortably
# larger than the slowest indicator window (SMA 200) so the charts have no
# warm-up gaps.
lookback_days: 500

# How many trading days to show on the charts.
chart_days: 180

indicators:
  sma_fast: 20
  sma_slow: 50
  sma_long: 200
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  fibonacci: true   # draw Fibonacci retracement levels on the price panel
  trendlines: true  # auto-detect support/resistance trendlines from swing pivots

# Where charts and the email preview are written.
output_dir: output

# Bullish scan (--scan): score the universe and email the top_n most bullish
# charts. Run on the 5:00pm ET weekday schedule.
#
# The universe is resolved at runtime from the published holdings of these
# ETFs (top ~10 per fund via Yahoo Finance, de-duplicated, US listings only).
scan:
  top_n: 5
  etf_holdings:
    - CHAT   # Roundhill Generative AI & Technology
    - CNEQ   # Alger Concentrated Equity
    - GRNY   # Fundstrat Granny Shots US Large Cap
  # Optional manual additions to the resolved holdings.
  extra_tickers: []
  # Fallback universe, used only if no ETF holdings can be fetched.
  universe:
    # mega/large-cap tech
    - AAPL
    - MSFT
    - NVDA
    - GOOGL
    - AMZN
    - META
    - TSLA
    - AVGO
    - AMD
    - QCOM
    - MU
    - INTC
    - CRM
    - ORCL
    - ADBE
    - NFLX
    - PLTR
    - UBER
    - SHOP
    - NOW
    # financials & payments
    - JPM
    - BAC
    - GS
    - MS
    - V
    - MA
    - AXP
    - PYPL
    - COIN
    - HOOD
    # consumer & retail
    - WMT
    - COST
    - HD
    - NKE
    - MCD
    - SBUX
    - DIS
    - PEP
    - KO
    - PG
    # healthcare
    - UNH
    - LLY
    - JNJ
    - PFE
